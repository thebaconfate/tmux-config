# Silences a warning
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins"

# Initialize TPM
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Status bar: tmux2k in the colours of Neovim's lualine `vscode` theme, with only CPU,
# battery and time on the right. It turns the mouse on so clicking the bar opens popups
# (@tmux2k-enable-popups false stops that).
# NOTE: must be listed before tmux-continuum. TPM loads plugins in this order, and tmux2k
# rewrites status-right, where continuum adds its auto-save hook; loaded after continuum,
# it would wipe the hook and continuum would silently stop saving.
set -g @plugin '2KAbhishek/tmux2k'
set -g @tmux2k-time-format "%a %H:%M"
set -g @tmux2k-right-plugins 'cpu battery time'
# Colour slots. The segment colours below are "<background> <text>", naming these slots.
set -g @tmux2k-black '#262626'       # bar background, and text on the current window
set -g @tmux2k-dark-gray '#373737'   # segments and other windows
set -g @tmux2k-white '#ffffff'
set -g @tmux2k-blue '#0a7aca'        # VS Code blue
set -g @tmux2k-light-blue '#5CB6F8'
set -g @tmux2k-green '#4EC9B0'       # teal
set -g @tmux2k-light-green '#4EC9B0' # also the current window's flags
set -g @tmux2k-pink '#DDB6F2'
set -g @tmux2k-red '#f44747'         # other windows' flags
set -g @tmux2k-session-colors 'blue white'
set -g @tmux2k-git-colors 'gray green'
set -g @tmux2k-cwd-colors 'gray light_blue'
set -g @tmux2k-cpu-colors 'gray light_green'
set -g @tmux2k-battery-colors 'gray pink'
set -g @tmux2k-time-colors 'blue white'
set -g @tmux2k-window-list-colors 'black blue'
# Square window tabs: a full block in the tab's colour instead of the rounded caps. Leaving
# these empty doesn't work, tmux2k then falls back to the rounded ones.
set -g @tmux2k-window-list-left-sep '█'
set -g @tmux2k-window-list-right-sep '█'

# Productivity
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-capture-pane-contents 'on'

set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'        # restore sessions on tmux start
set -g @continuum-save-interval '15'  # auto-save every 15 minutes

set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-open'

# Enhancements
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'

# TPM keybindings
bind-key R source-file ~/.tmux.conf \; display-message "Config reloaded!"
run '~/.tmux/plugins/tpm/tpm'

# Number windows and panes from 1, like the keyboard, so tmux's own prefix 1-9 line up
# with what the status bar shows. Closing a window renumbers the rest, leaving no gaps.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
# 0 sits after 9 on the keyboard, so it gets the tenth window
bind-key 0 select-window -t :=10
# Session picker (prefix s): sorted by name, rows labelled 1-9 then 0 to match, instead of
# tmux's 0-9. Rows past the tenth keep tmux's default M-a, M-b, ... shortcuts.
bind-key s choose-tree -Zs -O name -K"#{?#{e|<:#{line},9},#{e|+:#{line},1},#{?#{e|==:#{line},9},0,#{?#{e|<:#{line},36},M-#{a:#{e|+:#{line},87}},}}}"


# Panes, the Vim way: prefix h/j/k/l moves, prefix C-h/j/k/l resizes and repeats, so holding
# Ctrl and tapping keeps resizing without the prefix. l is also tmux's "last window", so in a
# window with a single pane it still does that.
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l if-shell -F "#{==:#{window_panes},1}" { last-window } { select-pane -R }
bind-key -r C-h resize-pane -L 5
bind-key -r C-j resize-pane -D 5
bind-key -r C-k resize-pane -U 5
bind-key -r C-l resize-pane -R 5
# Splits open in the current pane's folder instead of the session's. v is side by side like
# Vim's :vsplit, - is stacked (it looks like the divider). % and " are tmux's own keys for
# the same.
bind-key v split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"
bind-key % split-window -h -c "#{pane_current_path}"
bind-key '"' split-window -v -c "#{pane_current_path}"
# New windows always start in the session's folder (the project), wherever the current pane
# has cd'd to. Spelled out because tmux's default depends on which client runs the command.
bind-key c new-window -c "#{session_path}"

# Copy mode selects like Neovim's v and C-v: either one starts a selection of its kind, the
# other one switches a running selection to it, and pressing the same one again ends it.
# tmux's own way, Space to start and v to toggle block mode, is switched off: Space does
# nothing. Each key sets block mode itself, as tmux keeps it on after a selection ends.
unbind-key -T copy-mode-vi Space
bind-key -T copy-mode-vi v if-shell -F "#{selection_active}" \
  { if-shell -F "#{rectangle_toggle}" { send-keys -X rectangle-off } { send-keys -X clear-selection } } \
  { send-keys -X begin-selection ; send-keys -X rectangle-off }
bind-key -T copy-mode-vi C-v if-shell -F "#{selection_active}" \
  { if-shell -F "#{rectangle_toggle}" { send-keys -X clear-selection } { send-keys -X rectangle-on } } \
  { send-keys -X begin-selection ; send-keys -X rectangle-on }
