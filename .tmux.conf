# Silences a warning
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins"

# Initialize TPM
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Status bar: tmux's default look, with the prefix indicator, CPU and battery on the right.
# NOTE: must be set before the TPM `run` line at the bottom: the battery/cpu/prefix-highlight
# plugins fill in their #{...} placeholders when they load, and continuum appends its
# auto-save hook. A theme plugin that rewrites status-right after them would undo both,
# and continuum would silently stop saving.
set -g status-right "#{prefix_highlight} CPU #{cpu_percentage} | BAT #{battery_percentage} | %H:%M %d-%b"
set -g status-right-length 60

# Productivity
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-capture-pane-contents 'on'

set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'        # restore sessions on tmux start
set -g @continuum-save-interval '15'  # auto-save every 15 minutes

set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-open'

# Enhancements
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'

# TPM keybindings
bind-key R source-file ~/.tmux.conf \; display-message "Config reloaded!"
run '~/.tmux/plugins/tpm/tpm'

# Number windows and panes from 1, like the keyboard, so tmux's own prefix 1-9 line up
# with what the status bar shows. Closing a window renumbers the rest, leaving no gaps.
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
# 0 sits after 9 on the keyboard, so it gets the tenth window
bind-key 0 select-window -t :=10
# Session picker (prefix s): label rows 1-9 then 0 to match, instead of tmux's 0-9.
# Rows past the tenth keep tmux's default M-a, M-b, ... shortcuts.
bind-key s choose-tree -Zs -K "#{?#{e|<:#{line},9},#{e|+:#{line},1},#{?#{e|==:#{line},9},0,#{?#{e|<:#{line},36},M-#{a:#{e|+:#{line},87}},}}}"


