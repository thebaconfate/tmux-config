# Silences a warning
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins"

# Initialize TPM
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Productivity
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-capture-pane-contents 'on'

set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'        # restore sessions on tmux start
set -g @continuum-save-interval '15'  # auto-save every 15 minutes

set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-open'

# Enhancements
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'

# Themes / Status
set -g @plugin 'jimeh/tmux-powerline'

# TPM keybindings
bind-key R source-file ~/.tmux.conf \; display-message "Config reloaded!"
run '~/.tmux/plugins/tpm/tpm'

# Rebind window keybinds
# Unbind default number keys
unbind-key -n C-0
unbind-key -n C-1
unbind-key -n C-2
unbind-key -n C-3
unbind-key -n C-4
unbind-key -n C-5
unbind-key -n C-6
unbind-key -n C-7
unbind-key -n C-8
unbind-key -n C-9

# Bind keys 1-9,0 to windows 0-9 (left-to-right)
bind-key 1 select-window -t 0
bind-key 2 select-window -t 1
bind-key 3 select-window -t 2
bind-key 4 select-window -t 3
bind-key 5 select-window -t 4
bind-key 6 select-window -t 5
bind-key 7 select-window -t 6
bind-key 8 select-window -t 7
bind-key 9 select-window -t 8
bind-key 0 select-window -t 9


